.form-check:not(.form-switch)

.form-check:not(.form-switch) .form-check-input:disabled {

.form-switch .form-check-input:disabled,

  width: 32px;
  height: 20px;

  left: 0;

  height: 16px;

  display: block;

  height: 28px;

  margin: 0;
  padding: 0;

.form-range::-webkit-slider-runnable-track {

}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);

}

  border-color: var(--ring);

}

.form-range:disabled {

.btn:focus-visible {

      function separatedAuditRenderSelector() {

        if (separatedAuditState.tab === &#x27;machine&#x27; &amp;&amp; separatedAuditState.selectorLevel &gt; 1 &amp;&amp; !parentOptions.some((parent) =&gt; parent.id === separatedAuditState.parentFilter)) separatedAuditState.parentFilter = parentOptions[0] ? parentOptions[0].id : &#x27;all&#x27;;

          return `&lt;button type=&quot;button&quot; class=&quot;separated-audit-flat-item ${separatedAuditState.selected === label.id ? &#x27;is-selected&#x27; : &#x27;&#x27;}&quot; data-separated-label=&quot;${label.id}&quot;&gt;&lt;div&gt;&lt;strong&gt;${separatedAuditEscape(label.name)}&lt;/strong&gt;&lt;span&gt;上级：${separatedAuditEscape(parentSummary)}&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;separated-audit-flat-count&quot;&gt;已应用 ${separatedAuditRelationCount(label.id)}&lt;/span&gt;&lt;/button&gt;`;
        }).join(&#x27;&#x27;) || &#x27;&lt;div class=&quot;separated-audit-flat-empty&quot;&gt;当前筛选下没有标签&lt;/div&gt;&#x27;;
        levels.className = &#x27;separated-audit-label-browser&#x27;;

          const candidates = separatedAuditFlatLabels().filter((label) =&gt; label.level === separatedAuditState.selectorLevel &amp;&amp; (separatedAuditState.parentFilter === &#x27;all&#x27; || separatedAuditParentIds(label).includes(separatedAuditState.parentFilter)));

      function separatedAuditResetFilters() {

          const targetIds = new Set(separatedAuditDisplayConfigs.filter((config) =&gt; config.componentId === separatedAuditState.selected).flatMap((config) =&gt; config.targetIds));
          return separatedAuditDisplayTasks.filter((task) =&gt; targetIds.has(task.id)).filter((task) =&gt; {
            const haystack = [task.flow,task.group,task.task,task.taskId].join(&#x27; &#x27;).toLowerCase();
            return (!query || haystack.includes(query)) &amp;&amp; (status === &#x27;all&#x27; || task.status === status);
          });
        }
        if (separatedAuditState.tab === &#x27;machine&#x27;) {
          const label = separatedAuditLabel(separatedAuditState.selected);
          const rows = separatedAuditParentIds(label).flatMap((conditionId) =&gt; {
            const relation = separatedAuditRelations.machine[`${conditionId}::${label.id}`] || new Set();
            return separatedAuditTargets.machine.filter((target) =&gt; relation.has(target.id)).map((target) =&gt; ({...target, conditionId, taskCondition:separatedAuditMachineConditionOnTask(target,conditionId)}));
          });
          return rows.filter((row) =&gt; {
            const condition = separatedAuditLabel(row.conditionId);
            const taskCondition = row.taskCondition || {};
            const haystack = [row.flow,row.group,row.task,row.taskId,condition.name,condition.code,taskCondition.instance,taskCondition.op,taskCondition.threshold].filter(Boolean).join(&#x27; &#x27;).toLowerCase();

          });

        return separatedAuditCurrentTargets().filter((target) =&gt; separatedAuditRelationSet().has(target.id)).filter((target) =&gt; {
          const haystack = [target.flow,target.group,target.task,target.taskId,target.component,target.componentId].filter(Boolean).join(&#x27; &#x27;).toLowerCase();

      function separatedAuditRenderDisplayTable(rows) {
        const head = &#x27;&lt;th style=&quot;width:210px&quot;&gt;流程 / 分组&lt;/th&gt;&lt;th&gt;已应用任务&lt;/th&gt;&lt;th style=&quot;width:210px&quot;&gt;固定展示位置&lt;/th&gt;&lt;th style=&quot;width:105px&quot;&gt;任务状态&lt;/th&gt;&#x27;;

      function separatedAuditMachineItemById(itemId) {

e(target.status)}&lt;/span&gt;&lt;/span&gt;&lt;/label&gt;`; }).join(&#x27;&#x27;)}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`).join(&#x27;&#x27;) || &#x27;&lt;div class=&quot;separated-audit-flat-empty&quot;&gt;暂无任务配置该全局条件；请先前往任务配置创建算法因子条件&lt;/div&gt;&#x27;;
          return `&lt;section class=&quot;separated-audit-attach-target-group&quot;&gt;&lt;div class=&quot;separated-audit-attach-target-head&quot;&gt;&lt;label class=&quot;separated-audit-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-separated-attach-all=&quot;${condition.id}&quot;&gt;&lt;strong&gt;${separatedAuditEscape(condition.name)}&lt;/strong&gt;&lt;/label&gt;&lt;span class=&quot;separated-audit-secondary-text&quot;&gt;流程 → 分组 → 机审任务&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;separated-audit-attach-target-list separated-audit-attach-tree&quot;&gt;${taskTree}&lt;/div&gt;&lt;/section&gt;`;
        }).join(&#x27;&#x27;);
        separatedAuditFind(&#x27;#separated-audit-targets&#x27;).className = &#x27;&#x27;;
        separatedAuditFind(&#x27;#separated-audit-targets&#x27;).innerHTML = `&lt;div class=&quot;separated-audit-attach-title&quot;&gt;2. 选择应用机审任务&lt;span&gt;可按全局条件、流程、分组批量勾选，也可只选单个任务 ID；任务侧条件只读&lt;/span&gt;&lt;/div&gt;${targetGroups || &#x27;&lt;div class=&quot;separated-audit-flat-empty&quot;&gt;请先选择至少一个全局条件&lt;/div&gt;&#x27;}`;

        separatedAuditFindAll(&#x27;[data-separated-attach-condition]&#x27;).forEach((input) =&gt; input.addEventListener(&#x27;change&#x27;, () =&gt; {

        separatedAuditFindAll(&#x27;[data-separated-attach-all]&#x27;).forEach((input) =&gt; input.addEventListener(&#x27;change&#x27;, () =&gt; {

        separatedAuditFindAll(&#x27;[data-separated-attach-flow]&#x27;).forEach((input) =&gt; input.addEventListener(&#x27;change&#x27;, () =&gt; {

          separatedAuditRenderAttachMachineEditor();
        }));
        separatedAuditFindAll(&#x27;[data-separated-attach-group]&#x27;).forEach((input) =&gt; input.addEventListener(&#x27;change&#x27;, () =&gt; {
          const conditionId = input.dataset.conditionId;
          const leaves = separatedAuditFindAll(&#x27;[data-separated-attach-target]&#x27;).filter((leaf) =&gt; leaf.dataset.conditionId === conditionId &amp;&amp; leaf.dataset.flowIndex === input.dataset.flowIndex &amp;&amp; leaf.dataset.groupIndex === input.dataset.separatedAttachGroup);
          if (!draft.targetMap[conditionId]) draft.targetMap[conditionId] = new Set();
          leaves.forEach((leaf) =&gt; { if (input.checked) draft.targetMap[conditionId].add(leaf.dataset.separatedAttachTarget); else draft.targetMap[conditionId].delete(leaf.dataset.separatedAttachTarget); });

      function separatedAuditUpdateAttachParentStates() {
        const draft = separatedAuditState.attachMachineDraft;

        separatedAuditFindAll(&#x27;[data-separated-attach-flow]&#x27;).forEach((input) =&gt; setState(input,separatedAuditFindAll(&#x27;[data-separated-attach-target]&#x27;).filter((leaf) =&gt; leaf.dataset.conditionId === input.dataset.conditionId &amp;&amp; leaf.dataset.flowIndex === input.dataset.separatedAttachFlow)));

      function separatedAuditOpenMachineItemConfig(itemId) {
        const item = separatedAuditMachineItemById(itemId);
        if (!item) return;
        const isIncoming = separatedAuditIncomingMachineItems.some((candidate) =&gt; candidate.id === item.id);
        const conditionIds = isIncoming ? [] : separatedAuditParentIds(item);
        const targetMap = {};
        conditionIds.forEach((conditionId) =&gt; { targetMap[conditionId] = new Set(separatedAuditRelations.machine[`${conditionId}::${item.id}`] || []); });
        separatedAuditState.attachMachineDraft = {itemId:item.id,isIncoming,conditionIds:new Set(conditionIds),targetMap};
        separatedAuditPrepareModal(`${isIncoming ? &#x27;配置新标签&#x27; : &#x27;调整机审应用&#x27;}“${item.name}”`, &#x27;configure-machine-item&#x27;);
        separatedAuditRenderAttachMachineEditor();
        separatedAuditShowOverlay();
      }

      function separatedAuditOpenAttachMachineItem() {
        const item = separatedAuditIncomingMachineItems[0];
        if (!item) { separatedAuditShowToast(&#x27;暂无待接入的新标签&#x27;); return; }
        separatedAuditOpenMachineItemConfig(item.id);
      }

      function separatedAuditShowOverlay() {
        separatedAuditFind(&#x27;#separated-audit-overlay&#x27;).classList.add(&#x27;is-open&#x27;);
        separatedAuditFind(&#x27;#separated-audit-overlay&#x27;).setAttribute(&#x27;aria-hidden&#x27;,&#x27;false&#x27;);
        separatedAuditFind(&#x27;#separated-audit-close&#x27;).focus();
      }

      function separatedAuditRelationScopeIds() {
        const scopeInputs = separatedAuditFindAll(&#x27;[data-separated-scope]&#x27;);
        return scopeInputs.length ? scopeInputs.filter((input) =&gt; input.checked).map((input) =&gt; input.dataset.separatedScope) : [separatedAuditState.selected];
      }

      function separatedAuditGroupedRelationTargets() {
        const flows = [];
        separatedAuditCurrentTargets().forEach((target) =&gt; {
          let flow = flows.find((item) =&gt; item.name === target.flow);
          if (!flow) { flow = {name:target.flow, groups:[]}; flows.push(flow); }
          let group = flow.groups.find((item) =&gt; item.name === target.group);
          if (!group) { group = {name:target.group, targets:[]}; flow.groups.push(group); }
          group.targets.push(target);
        });
        return flows;
      }

      function separatedAuditRelationState(targetId, labelIds) {
        const hits = labelIds.filter((labelId) =&gt; separatedAuditRelationSet(labelId).has(targetId)).length;
        if (!hits) return &#x27;未关联&#x27;;
        if (hits === labelIds.length) return &#x27;已关联&#x27;;
        return &#x27;部分关联&#x27;;
      }

      function separatedAuditRenderRelationTargets() {
        const label = separatedAuditLabel(separatedAuditState.selected);
        const labelIds = separatedAuditRelationScopeIds();
        const flows = separatedAuditGroupedRelationTargets();
        const mode = separatedAuditState.relationMode;
        const html = flows.map((flow, flowIndex) =&gt; `&lt;section class=&quot;separated-audit-relation-flow&quot;&gt;&lt;div class=&quot;separated-audit-relation-flow-head&quot;&gt;&lt;label class=&quot;separated-audit-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-separated-relation-flow=&quot;${flowIndex}&quot;&gt;&lt;strong&gt;${separatedAuditEscape(flow.name)}&lt;/strong&gt;&lt;/label&gt;&lt;span class=&quot;separated-audit-secondary-text&quot;&gt;${flow.groups.reduce((sum, group) =&gt; sum + group.targets.length, 0)} 个答题组件&lt;/span&gt;&lt;/div&gt;${flow.groups.map((group, groupIndex) =&gt; {
          const taskGroups = [];
          group.targets.forEach((target) =&gt; {
            let taskGroup = taskGroups.find((item) =&gt; item.taskId === target.taskId);
            if (!taskGroup) { taskGroup = {taskId:target.taskId,task:target.task,status:target.status,targets:[]}; taskGroups.push(taskGroup); }
            taskGroup.targets.push(target);
          });
          return `&lt;div&gt;&lt;div class=&quot;separated-audit-relation-group-head&quot;&gt;&lt;label class=&quot;separated-audit-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-separated-relation-group=&quot;${groupIndex}&quot; data-flow-index=&quot;${flowIndex}&quot;&gt;&lt;span&gt;${separatedAuditEscape(group.name)}&lt;/span&gt;&lt;/label&gt;&lt;span class=&quot;separated-audit-secondary-text&quot;&gt;${taskGroups.length} 个人审任务 · ${group.targets.length} 个答题组件&lt;/span&gt;&lt;/div&gt;${taskGroups.map((taskGroup,taskIndex) =&gt; `&lt;div class=&quot;separated-audit-relation-task-block&quot;&gt;&lt;div class=&quot;separated-audit-relation-task-head&quot;&gt;&lt;label class=&quot;separated-audit-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-separated-relation-task=&quot;${taskIndex}&quot; data-flow-index=&quot;${flowIndex}&quot; data-group-index=&quot;${groupIndex}&quot;&gt;&lt;span&gt;&lt;strong&gt;${separatedAuditEscape(taskGroup.task)}&lt;/strong&gt;&lt;small&gt;taskId ${separatedAuditEscape(taskGroup.taskId)}&lt;/small&gt;&lt;/span&gt;&lt;/label&gt;${separatedAuditStatus(taskGroup.status)}&lt;/div&gt;${taskGroup.targets.map((target) =&gt; {
            const relationState = separatedAuditRelationState(target.id, labelIds);
            const noChange = mode === &#x27;add&#x27; ? relationState === &#x27;已关联&#x27; : relationState === &#x27;未关联&#x27;;
            const disabled = noChange || !labelIds.length;
            return `&lt;div class=&quot;separated-audit-relation-leaf ${disabled ? &#x27;is-disabled&#x27; : &#x27;&#x27;}&quot;&gt;&lt;input type=&quot;checkbox&quot; data-separated-target=&quot;${target.id}&quot; data-flow-index=&quot;${flowIndex}&quot; data-group-index=&quot;${groupIndex}&quot; data-task-index=&quot;${taskIndex}&quot; ${disabled ? &#x27;disabled&#x27; : &#x27;&#x27;} aria-label=&quot;选择${separatedAuditEscape(target.component)}&quot;&gt;&lt;div&gt;&lt;span class=&quot;separated-audit-primary-text&quot;&gt;${separatedAuditEscape(target.component)}&lt;/span&gt;&lt;span class=&quot;separated-audit-secondary-text&quot;&gt;${separatedAuditEscape(target.componentId)}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;separated-audit-condition-summary&quot;&gt;&lt;span class=&quot;separated-audit-primary-text&quot;&gt;${separatedAuditEscape(target.componentType)}&lt;/span&gt;&lt;div class=&quot;separated-audit-condition-tags&quot;&gt;具体答题组件实例&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;separated-audit-badge ${relationState === &#x27;已关联&#x27; ? &#x27;is-success&#x27; : &#x27;&#x27;}&quot;&gt;${relationState}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`;
          }).join(&#x27;&#x27;)}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
        }).join(&#x27;&#x27;)}&lt;/section&gt;`).join(&#x27;&#x27;);
        separatedAuditFind(&#x27;#separated-audit-targets&#x27;).className = &#x27;separated-audit-relation-tree&#x27;;
        separatedAuditFind(&#x27;#separated-audit-targets&#x27;).innerHTML = html;
        separatedAuditBindRelationTree();
        separatedAuditUpdateModalSummary();
      }

      function separatedAuditUpdateRelationParentStates() {
        separatedAuditFindAll(&#x27;[data-separated-relation-task]&#x27;).forEach((taskInput) =&gt; {
          const leaves = separatedAuditFindAll(`[data-separated-target][data-flow-index=&quot;${taskInput.dataset.flowIndex}&quot;][data-group-index=&quot;${taskInput.dataset.groupIndex}&quot;][data-task-index=&quot;${taskInput.dataset.separatedRelationTask}&quot;]:not(:disabled)`);
          taskInput.disabled = !leaves.length;
          taskInput.checked = leaves.length &gt; 0 &amp;&amp; leaves.every((leaf) =&gt; leaf.checked);
          taskInput.indeterminate = !taskInput.checked &amp;&amp; leaves.some((leaf) =&gt; leaf.checked);
        });
        separatedAuditFindAll(&#x27;[data-separated-relation-group]&#x27;).forEach((groupInput) =&gt; {
          const leaves = separatedAuditFindAll(`[data-separated-target][data-flow-index=&quot;${groupInput.dataset.flowIndex}&quot;][data-group-index=&quot;${groupInput.dataset.separatedRelationGroup}&quot;]:not(:disabled)`);
          groupInput.disabled = !leaves.length;
          groupInput.checked = leaves.length &gt; 0 &amp;&amp; leaves.every((leaf) =&gt; leaf.checked);
          groupInput.indeterminate = !groupInput.checked &amp;&amp; leaves.some((leaf) =&gt; leaf.checked);
        });
        separatedAuditFindAll(&#x27;[data-separated-relation-flow]&#x27;).forEach((flowInput) =&gt; {
          const leaves = separatedAuditFindAll(`[data-separated-target][data-flow-index=&quot;${flowInput.dataset.separatedRelationFlow}&quot;]:not(:disabled)`);
          flowInput.disabled = !leaves.length;
          flowInput.checked = leaves.length &gt; 0 &amp;&amp; leaves.every((leaf) =&gt; leaf.checked);
          flowInput.indeterminate = !flowInput.checked &amp;&amp; leaves.some((leaf) =&gt; leaf.checked);
        });
      }

      function separatedAuditBindRelationTree() {
        separatedAuditFindAll(&#x27;[data-separated-relation-flow]&#x27;).forEach((flowInput) =&gt; flowInput.addEventListener(&#x27;change&#x27;, () =&gt; {
          separatedAuditFindAll(`[data-separated-target][data-flow-index=&quot;${flowInput.dataset.separatedRelationFlow}&quot;]:not(:disabled)`).forEach((leaf) =&gt; { leaf.checked = flowInput.checked; });
          separatedAuditUpdateRelationParentStates();
          separatedAuditUpdateModalSummary();
        }));
        separatedAuditFindAll(&#x27;[data-separated-relation-group]&#x27;).forEach((groupInput) =&gt; groupInput.addEventListener(&#x27;change&#x27;, () =&gt; {
          separatedAuditFindAll(`[data-separated-target][data-flow-index=&quot;${groupInput.dataset.flowIndex}&quot;][data-group-index=&quot;${groupInput.dataset.separatedRelationGroup}&quot;]:not(:disabled)`).forEach((leaf) =&gt; { leaf.checked = groupInput.checked; });
          separatedAuditUpdateRelationParentStates();
          separatedAuditUpdateModalSummary();
        }));
        separatedAuditFindAll(&#x27;[data-separated-relation-task]&#x27;).forEach((taskInput) =&gt; taskInput.addEventListener(&#x27;change&#x27;, () =&gt; {
          separatedAuditFindAll(`[data-separated-target][data-flow-index=&quot;${taskInput.dataset.flowIndex}&quot;][data-group-index=&quot;${taskInput.dataset.groupIndex}&quot;][data-task-index=&quot;${taskInput.dataset.separatedRelationTask}&quot;]:not(:disabled)`).forEach((leaf) =&gt; { leaf.checked = taskInput.checked; });
          separatedAuditUpdateRelationParentStates();
          separatedAuditUpdateModalSummary();
        }));
        separatedAuditFindAll(&#x27;[data-separated-target]&#x27;).forEach((leaf) =&gt; leaf.addEventListener(&#x27;change&#x27;, () =&gt; {
          separatedAuditUpdateRelationParentStates();
          separatedAuditUpdateModalSummary();
        }));
        separatedAuditUpdateRelationParentStates();
      }

      function separatedAuditOpenRelationModal() {
        const label = separatedAuditLabel(separatedAuditState.selected);
        const relationContext = separatedAuditState.tab === &#x27;machine&#x27; ? `${separatedAuditLabel(separatedAuditActiveMachineParent(label)).name} / ${label.name}` : label.name;
        separatedAuditState.relationMode = &#x27;add&#x27;;
        separatedAuditPrepareModal(`调整“${relationContext}”答题组件应用`, &#x27;relation&#x27;);
        separatedAuditFind(&#x27;#separated-audit-scope&#x27;).innerHTML = `&lt;div class=&quot;separated-audit-operation-bar&quot;&gt;&lt;div&gt;&lt;strong&gt;操作方式&lt;/strong&gt;&lt;label class=&quot;separated-audit-check&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;separated-audit-relation-mode&quot; value=&quot;add&quot; checked&gt;&lt;span&gt;新增应用&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;separated-audit-check&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;separated-audit-relation-mode&quot; value=&quot;remove&quot;&gt;&lt;span&gt;解除应用&lt;/span&gt;&lt;/label&gt;&lt;/div&gt;&lt;span class=&quot;separated-audit-operation-note&quot;&gt;按流程 → 分组 → 人审任务 → 具体答题组件实例选择&lt;/span&gt;&lt;/div&gt;${separatedAuditRenderScope(label)}`;
        separatedAuditFindAll(&#x27;input[name=&quot;separated-audit-relation-mode&quot;]&#x27;).forEach((input) =&gt; input.addEventListener(&#x27;change&#x27;, () =&gt; {
          separatedAuditState.relationMode = input.value;
          separatedAuditRenderRelationTargets();
        }));
        separatedAuditFindAll(&#x27;[data-separated-scope]&#x27;).forEach((input) =&gt; input.addEventListener(&#x27;change&#x27;, separatedAuditRenderRelationTargets));
        separatedAuditRenderRelationTargets();
        separatedAuditShowOverlay();
      }

      function separatedAuditGroupedDisplayTasks() {
        const flows = [];
        separatedAuditDisplayTasks.forEach((task) =&gt; {
          let flow = flows.find((item) =&gt; item.name === task.flow);
          if (!flow) { flow = {name:task.flow, groups:[]}; flows.push(flow); }
          let group = flow.groups.find((item) =&gt; item.name === task.group);
          if (!group) { group = {name:task.group, tasks:[]}; flow.groups.push(group); }
          group.tasks.push(task);
        });
        return flows;
      }

      function separatedAuditDisplayTaskTree(record) {
        const flows = separatedAuditGroupedDisplayTasks();
        const flowIndex = Math.min(separatedAuditState.displayActiveFlow, Math.max(0,flows.length - 1));
        const activeFlow = flows[flowIndex] || {groups:[]};
        const groupIndex = Math.min(separatedAuditState.displayActiveGroup, Math.max(0,activeFlow.groups.length - 1));
        const activeGroup = activeFlow.groups[groupIndex] || {tasks:[]};
        const selected = new Set(record.targetIds);
        const flowOptions = flows.map((flow,index) =&gt; `&lt;div class=&quot;separated-audit-cascader-option ${index === flowIndex ? &#x27;is-active&#x27; : &#x27;&#x27;}&quot;&gt;&lt;input type=&quot;checkbox&quot; data-separated-display-flow=&quot;${index}&quot; aria-label=&quot;选择流程${separatedAuditEscape(flow.name)}&quot;&gt;&lt;button type=&quot;button&quot; data-separated-display-nav-flow=&quot;${index}&quot;&gt;${separatedAuditEscape(flow.name)}&lt;/button&gt;&lt;small&gt;${flow.groups.reduce((sum,group) =&gt; sum + group.tasks.length,0)} ›&lt;/small&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
        const groupOptions = activeFlow.groups.map((group,index) =&gt; `&lt;div class=&quot;separated-audit-cascader-option ${index === groupIndex ? &#x27;is-active&#x27; : &#x27;&#x27;}&quot;&gt;&lt;input type=&quot;checkbox&quot; data-separated-display-group=&quot;${index}&quot; data-flow-index=&quot;${flowIndex}&quot; aria-label=&quot;选择分组${separatedAuditEscape(group.name)}&quot;&gt;&lt;button type=&quot;button&quot; data-separated-display-nav-group=&quot;${index}&quot;&gt;${separatedAuditEscape(group.name)}&lt;/button&gt;&lt;small&gt;${group.tasks.length} ›&lt;/small&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
        const taskOptions = activeGroup.tasks.map((task) =&gt; `&lt;label class=&quot;separated-audit-cascader-option&quot;&gt;&lt;input type=&quot;checkbox&quot; data-separated-display-target=&quot;${task.id}&quot; ${selected.has(task.id) ? &#x27;checked&#x27; : &#x27;&#x27;}&gt;&lt;span&gt;&lt;strong&gt;${separatedAuditEscape(task.task)}&lt;/strong&gt;&lt;small class=&quot;separated-audit-secondary-text&quot;&gt;taskId ${separatedAuditEscape(task.taskId)}&lt;/small&gt;&lt;/span&gt;${separatedAuditStatus(task.status)}&lt;/label&gt;`).join(&#x27;&#x27;);
        const selectedTasks = separatedAuditDisplayTasks.filter((task) =&gt; selected.has(task.id));
        const chips = selectedTasks.length ? selectedTasks.map((task) =&gt; `&lt;span class=&quot;separated-audit-cascader-chip&quot;&gt;${separatedAuditEscape(task.task)}&lt;button type=&quot;button&quot; data-separated-display-remove=&quot;${task.id}&quot; aria-label=&quot;移除${separatedAuditEscape(task.task)}&quot;&gt;×&lt;/button&gt;&lt;/span&gt;`).join(&#x27;&#x27;) : &#x27;&lt;span&gt;尚未选择任务&lt;/span&gt;&#x27;;
        const panel = separatedAuditState.displaySelectorOpen ? `&lt;div class=&quot;separated-audit-cascader-panel&quot;&gt;&lt;div class=&quot;separated-audit-cascader-column&quot;&gt;&lt;div class=&quot;separated-audit-cascader-column-title&quot;&gt;1. 流程（可批量勾选）&lt;/div&gt;${flowOptions}&lt;/div&gt;&lt;div class=&quot;separated-audit-cascader-column&quot;&gt;&lt;div class=&quot;separated-audit-cascader-column-title&quot;&gt;2. 分组（可批量勾选）&lt;/div&gt;${groupOptions}&lt;/div&gt;&lt;div class=&quot;separated-audit-cascader-column&quot;&gt;&lt;div class=&quot;separated-audit-cascader-column-title&quot;&gt;3. 任务名称 / ID&lt;/div&gt;${taskOptions}&lt;/div&gt;&lt;/div&gt;` : &#x27;&#x27;;
        return `&lt;button type=&quot;button&quot; class=&quot;separated-audit-cascader-field&quot; data-separated-display-toggle&gt;&lt;strong&gt;流程 → 分组 → 任务&lt;/strong&gt;&lt;span&gt;已选 ${selected.size} 个任务 ${separatedAuditState.displaySelectorOpen ? &#x27;▴&#x27; : &#x27;▾&#x27;}&lt;/span&gt;&lt;/button&gt;${panel}&lt;div class=&quot;separated-audit-cascader-selected&quot;&gt;&lt;span&gt;已选任务&lt;/span&gt;${chips}&lt;/div&gt;`;
      }

      function separatedAuditCaptureDisplayRecords() {
        const record = separatedAuditState.displayDraftRecords[0] || {targetIds:[]};
        return [{targetIds:[...record.targetIds]}];
      }

      function separatedAuditUpdateDisplayParentStates(recordElement) {
        const flows = separatedAuditGroupedDisplayTasks();
        const selected = new Set((separatedAuditState.displayDraftRecords[0] || {targetIds:[]}).targetIds);
        recordElement.querySelectorAll(&#x27;[data-separated-display-group]&#x27;).forEach((groupInput) =&gt; {
          const group = (flows[Number(groupInput.dataset.flowIndex)] || {groups:[]}).groups[Number(groupInput.dataset.separatedDisplayGroup)];
          const taskIds = group ? group.tasks.map((task) =&gt; task.id) : [];
          groupInput.checked = taskIds.length &gt; 0 &amp;&amp; taskIds.every((id) =&gt; selected.has(id));
          groupInput.indeterminate = !groupInput.checked &amp;&amp; taskIds.some((id) =&gt; selected.has(id));
        });
        recordElement.querySelectorAll(&#x27;[data-separated-display-flow]&#x27;).forEach((flowInput) =&gt; {
          const flow = flows[Number(flowInput.dataset.separatedDisplayFlow)];
          const taskIds = flow ? flow.groups.flatMap((group) =&gt; group.tasks.map((task) =&gt; task.id)) : [];
          flowInput.checked = taskIds.length &gt; 0 &amp;&amp; taskIds.every((id) =&gt; selected.has(id));
          flowInput.indeterminate = !flowInput.checked &amp;&amp; taskIds.some((id) =&gt; selected.has(id));
        });
      }

      function separatedAuditBindDisplayRecord(recordElement) {
        const flows = separatedAuditGroupedDisplayTasks();
        const record = separatedAuditState.displayDraftRecords[0];
        const selected = new Set(record.targetIds);
        const applySelection = (next) =&gt; { record.targetIds = separatedAuditDisplayTasks.filter((task) =&gt; next.has(task.id)).map((task) =&gt; task.id); separatedAuditRenderDisplayRecords(); };
        const toggleIds = (ids, checked) =&gt; { ids.forEach((id) =&gt; checked ? selected.add(id) : selected.delete(id)); applySelection(selected); };
        const toggle = recordElement.querySelector(&#x27;[data-separated-display-toggle]&#x27;);
        if (toggle) toggle.addEventListener(&#x27;click&#x27;, () =&gt; { separatedAuditState.displaySelectorOpen = !separatedAuditState.displaySelectorOpen; separatedAuditRenderDisplayRecords(); });
        recordElement.querySelectorAll(&#x27;[data-separated-display-nav-flow]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; { separatedAuditState.displayActiveFlow = Number(button.dataset.separatedDisplayNavFlow); separatedAuditState.displayActiveGroup = 0; separatedAuditRenderDisplayRecords(); }));
        recordElement.querySelectorAll(&#x27;[data-separated-display-nav-group]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; { separatedAuditState.displayActiveGroup = Number(button.dataset.separatedDisplayNavGroup); separatedAuditRenderDisplayRecords(); }));
        recordElement.querySelectorAll(&#x27;[data-separated-display-flow]&#x27;).forEach((flowInput) =&gt; flowInput.addEventListener(&#x27;change&#x27;, () =&gt; {
          const flow = flows[Number(flowInput.dataset.separatedDisplayFlow)];
          toggleIds(flow.groups.flatMap((group) =&gt; group.tasks.map((task) =&gt; task.id)),flowInput.checked);
        }));
        recordElement.querySelectorAll(&#x27;[data-separated-display-group]&#x27;).forEach((groupInput) =&gt; groupInput.addEventListener(&#x27;change&#x27;, () =&gt; {
          const group = flows[Number(groupInput.dataset.flowIndex)].groups[Number(groupInput.dataset.separatedDisplayGroup)];
          toggleIds(group.tasks.map((task) =&gt; task.id),groupInput.checked);
        }));
        recordElement.querySelectorAll(&#x27;[data-separated-display-target]&#x27;).forEach((task) =&gt; task.addEventListener(&#x27;change&#x27;, () =&gt; {
          if (task.checked) selected.add(task.dataset.separatedDisplayTarget); else selected.delete(task.dataset.separatedDisplayTarget);
          applySelection(selected);
        }));
        recordElement.querySelectorAll(&#x27;[data-separated-display-remove]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; { selected.delete(button.dataset.separatedDisplayRemove); applySelection(selected); }));
        separatedAuditUpdateDisplayParentStates(recordElement);
      }

      function separatedAuditRenderDisplayRecords() {
        separatedAuditFind(&#x27;#separated-audit-targets&#x27;).className = &#x27;separated-audit-targets&#x27;;
        const record = separatedAuditState.displayDraftRecords[0] || {targetIds:[]};
        separatedAuditFind(&#x27;#separated-audit-targets&#x27;).innerHTML = `&lt;section class=&quot;separated-audit-record&quot; data-separated-record=&quot;0&quot;&gt;&lt;div class=&quot;separated-audit-record-head&quot;&gt;&lt;strong&gt;选择应用任务&lt;/strong&gt;&lt;span class=&quot;separated-audit-badge&quot;&gt;固定位置：${separatedAuditEscape(separatedAuditFixedPosition)}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;separated-audit-task-tree&quot;&gt;${separatedAuditDisplayTaskTree(record)}&lt;/div&gt;&lt;/section&gt;`;
        separatedAuditFindAll(&#x27;[data-separated-record]&#x27;).forEach(separatedAuditBindDisplayRecord);
        separatedAuditUpdateModalSummary();
      }

      function separatedAuditOpenDisplayModal(configId = null) {
        const component = separatedAuditDisplayComponent();
        const existing = separatedAuditDisplayConfigs.find((config) =&gt; config.componentId === component.id) || (configId ? separatedAuditDisplayConfigs.find((config) =&gt; config.id === configId) : null);
        separatedAuditState.displayEditingId = existing ? existing.id : null;
        separatedAuditState.displayDraftRecords = existing ? [{targetIds:[...existing.targetIds]}] : [{targetIds:[]}];
        separatedAuditState.displayActiveFlow = 0;
        separatedAuditState.displayActiveGroup = 0;
        separatedAuditState.displaySelectorOpen = true;
        separatedAuditPrepareModal(`管理“${component.name}”应用任务`, &#x27;display&#x27;);
        separatedAuditFind(&#x27;#separated-audit-scope&#x27;).innerHTML = `&lt;div class=&quot;separated-audit-display-intro&quot;&gt;&lt;div&gt;&lt;strong&gt;展示组件：${separatedAuditEscape(component.name)}&lt;/strong&gt;&lt;span&gt;通过三级级联下拉选择流程 → 分组 → 任务；位置固定为${separatedAuditEscape(separatedAuditFixedPosition)}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`;
        separatedAuditRenderDisplayRecords();
        separatedAuditShowOverlay();
      }

      function separatedAuditUpdateModalSummary() {
        if (separatedAuditState.modalKind === &#x27;configure-machine-item&#x27;) {
          const draft = separatedAuditState.attachMachineDraft;
          const taskRelationCount = Array.from(draft.conditionIds).reduce((sum, conditionId) =&gt; sum + (draft.targetMap[conditionId] || new Set()).size, 0);
          separatedAuditFind(&#x27;#separated-audit-modal-summary&#x27;).textContent = `${draft.conditionIds.size} 个全局条件池 · ${taskRelationCount} 个任务条件实例`;
          return;
        }
        if (separatedAuditState.modalKind === &#x27;display&#x27;) {
          const records = separatedAuditCaptureDisplayRecords();
          const taskIds = new Set(records.flatMap((record) =&gt; record.targetIds));
          separatedAuditFind(&#x27;#separated-audit-modal-summary&#x27;).textContent = `${taskIds.size} 个生效任务 · 位置固定为第二列最下方`;
          return;
        }
        const targetCount = separatedAuditFindAll(&#x27;[data-separated-target]:checked&#x27;).length;
        const scopeCount = separatedAuditRelationScopeIds().length;
        const verb = separatedAuditState.relationMode === &#x27;add&#x27; ? &#x27;新增&#x27; : &#x27;解除&#x27;;
        if (!scopeCount) separatedAuditFind(&#x27;#separated-audit-modal-summary&#x27;).textContent = &#x27;请至少保留一个标签&#x27;;
        else separatedAuditFind(&#x27;#separated-audit-modal-summary&#x27;).textContent = separatedAuditState.tab === &#x27;manual&#x27; ? `${verb}：${scopeCount} 个标签 × ${targetCount} 个答题组件` : `${verb}：${targetCount} 条任务标签关系；任务内判定方式只读`;
      }

      function separatedAuditPrepareConfirmation() {
        if (separatedAuditState.modalKind === &#x27;configure-machine-item&#x27;) {
          const draft = separatedAuditState.attachMachineDraft;
          const mappings = Array.from(draft.conditionIds).map((conditionId) =&gt; ({conditionId,targetIds:[...(draft.targetMap[conditionId] || new Set())]}));
          const taskRelationCount = mappings.reduce((sum, mapping) =&gt; sum + mapping.targetIds.length, 0);
          if (!mappings.length) {
            separatedAuditFind(&#x27;#separated-audit-modal-summary&#x27;).textContent = &#x27;请至少选择一个全局条件&#x27;;
            return;
          }
          if (draft.isIncoming &amp;&amp; !taskRelationCount) {
            separatedAuditFind(&#x27;#separated-audit-modal-summary&#x27;).textContent = &#x27;请至少选择一个任务条件实例&#x27;;
            return;
          }
          const item = separatedAuditMachineItemById(draft.itemId);
          const currentConditionIds = new Set(separatedAuditParentIds(item));
          const nextConditionIds = new Set(mappings.map((mapping) =&gt; mapping.conditionId));
          const diff = {
            poolAdded:[...nextConditionIds].filter((id) =&gt; !currentConditionIds.has(id)).length,
            poolRemoved:[...currentConditionIds].filter((id) =&gt; !nextConditionIds.has(id)).length,
            relationAdded:0,
            relationRemoved:0
          };
          new Set([...currentConditionIds,...nextConditionIds]).forEach((conditionId) =&gt; {
            const currentTargets = separatedAuditRelations.machine[`${conditionId}::${item.id}`] || new Set();
            const mapping = mappings.find((candidate) =&gt; candidate.conditionId === conditionId);
            const nextTargets = new Set(mapping ? mapping.targetIds : []);
            nextTargets.forEach((id) =&gt; { if (!currentTargets.has(id)) diff.relationAdded += 1; });
            currentTargets.forEach((id) =&gt; { if (!nextTargets.has(id)) diff.relationRemoved += 1; });
          });
          if (!draft.isIncoming &amp;&amp; !diff.poolAdded &amp;&amp; !diff.poolRemoved &amp;&amp; !diff.relationAdded &amp;&amp; !diff.relationRemoved) {
            separatedAuditFind(&#x27;#separated-audit-modal-summary&#x27;).textContent = &#x27;当前配置没有变化&#x27;;
            return;
          }
          separatedAuditState.pending = {kind:&#x27;configure-machine-item&#x27;,itemId:draft.itemId,isIncoming:draft.isIncoming,mappings,diff};
        } else if (separatedAuditState.modalKind === &#x27;display&#x27;) {
          const records = separatedAuditCaptureDisplayRecords();
          if (!separatedAuditState.displayEditingId &amp;&amp; records.some((record) =&gt; !record.targetIds.length)) {
            separatedAuditFind(&#x27;#separated-audit-modal-summary&#x27;).textContent = &#x27;请至少选择一个任务&#x27;;
            return;
          }
          separatedAuditState.pending = {kind:&#x27;display&#x27;, records:records.map((record) =&gt; ({targetIds:[...record.targetIds]}))};
        } else {
          const targetIds = separatedAuditFindAll(&#x27;[data-separated-target]:checked&#x27;).map((input) =&gt; input.dataset.separatedTarget);
          const labelIds = separatedAuditRelationScopeIds();
          if (!labelIds.length) {
            separatedAuditFind(&#x27;#separated-audit-modal-summary&#x27;).textContent = &#x27;请至少保留一个标签&#x27;;
            return;
          }
          if (!targetIds.length) {
            separatedAuditFind(&#x27;#separated-audit-modal-summary&#x27;).textContent = &#x27;请至少选择一个应用对象&#x27;;
            return;
          }
          let added = 0;
          let removed = 0;
          const affectedIds = new Set();
          labelIds.forEach((labelId) =&gt; {
            const current = separatedAuditRelationSet(labelId);
            targetIds.forEach((targetId) =&gt; {
              if (separatedAuditState.relationMode === &#x27;add&#x27; &amp;&amp; !current.has(targetId)) { added += 1; affectedIds.add(targetId); }
              if (separatedAuditState.relationMode === &#x27;remove&#x27; &amp;&amp; current.has(targetId)) { removed += 1; affectedIds.add(targetId); }
            });
          });
          if (!added &amp;&amp; !removed) {
            separatedAuditFind(&#x27;#separated-audit-modal-summary&#x27;).textContent = &#x27;所选对象没有可生效的变化&#x27;;
            return;
          }
          separatedAuditState.pending = {kind:&#x27;relation&#x27;, mode:separatedAuditState.relationMode, labelIds, targetIds, added, removed, affectedIds:[...affectedIds]};
        }
        separatedAuditRenderConfirmation();
      }

      function separatedAuditRenderConfirmation() {
        const pending = separatedAuditState.pending;
        let html = &#x27;&#x27;;
        let summary = &#x27;&#x27;;
        if (pending.kind === &#x27;configure-machine-item&#x27;) {
          const item = separatedAuditMachineItemById(pending.itemId);
          const conditionNames = pending.mappings.map((mapping) =&gt; separatedAuditLabel(mapping.conditionId).name);
          const targetIds = new Set(pending.mappings.flatMap((mapping) =&gt; mapping.targetIds));
          const targets = separatedAuditTargets.machine.filter((target) =&gt; targetIds.has(target.id));
          const online = targets.filter((target) =&gt; target.status === &#x27;已上线&#x27;).length;
          const relationCount = pending.mappings.reduce((sum, mapping) =&gt; sum + mapping.targetIds.length, 0);
          const diffText = `条件池 +${pending.diff.poolAdded} / -${pending.diff.poolRemoved}；任务关系 +${pending.diff.relationAdded} / -${pending.diff.relationRemoved}`;
          html = `&lt;h3 class=&quot;separated-audit-confirm-title&quot;&gt;${pending.isIncoming ? &#x27;确认新标签接入机审&#x27; : &#x27;确认机审应用调整&#x27;}&lt;/h3&gt;&lt;div class=&quot;separated-audit-impact-list&quot;&gt;&lt;div class=&quot;separated-audit-impact-row&quot;&gt;&lt;span&gt;${pending.isIncoming ? &#x27;新标签&#x27; : &#x27;机审标签&#x27;}&lt;/span&gt;&lt;strong&gt;${separatedAuditEscape(item.name)}&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;separated-audit-impact-row&quot;&gt;&lt;span&gt;本次变更&lt;/span&gt;&lt;strong&gt;${diffText}&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;separated-audit-impact-row&quot;&gt;&lt;span&gt;对应全局条件&lt;/span&gt;&lt;span&gt;${separatedAuditEscape(conditionNames.join(&#x27;、&#x27;))}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;separated-audit-impact-row&quot;&gt;&lt;span&gt;应用任务&lt;/span&gt;&lt;span&gt;${relationCount} 个任务条件实例，涉及 ${targets.length} 个任务（已上线 ${online}，未上线 ${targets.length - online}）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;separated-audit-impact-row&quot;&gt;&lt;span&gt;任务侧条件&lt;/span&gt;&lt;span&gt;包含/不包含、枚举、数值阈值和失败策略均保持原配置&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;separated-audit-impact-row&quot;&gt;&lt;span&gt;版本校验&lt;/span&gt;&lt;span&gt;同时校验标签关系与任务条件实例版本，冲突则整次阻止&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`;
          summary = `待生效：${diffText}`;
        } else if (pending.kind === &#x27;display&#x27;) {
          const component = separatedAuditDisplayComponent();
          const targetIds = new Set(pending.records.flatMap((record) =&gt; record.targetIds));
          const targets = separatedAuditDisplayTasks.filter((task) =&gt; targetIds.has(task.id));
          const online = targets.filter((task) =&gt; task.status === &#x27;已上线&#x27;).length;
          html = `&lt;h3 class=&quot;separated-audit-confirm-title&quot;&gt;确认展示组件配置生效&lt;/h3&gt;&lt;div class=&quot;separated-audit-impact-list&quot;&gt;&lt;div class=&quot;separated-audit-impact-row&quot;&gt;&lt;span&gt;展示组件&lt;/span&gt;&lt;strong&gt;${separatedAuditEscape(component.name)}&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;separated-audit-impact-row&quot;&gt;&lt;span&gt;固定位置&lt;/span&gt;&lt;span&gt;${separatedAuditEscape(separatedAuditFixedPosition)}（系统固定）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;separated-audit-impact-row&quot;&gt;&lt;span&gt;影响任务&lt;/span&gt;&lt;span&gt;${targets.length ? `${targets.length} 个任务（已上线 ${online}，未上线 ${targets.length - online}）` : &#x27;解除当前组件的全部任务应用&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;separated-audit-impact-row&quot;&gt;&lt;span&gt;配置快照&lt;/span&gt;&lt;span&gt;保存本次明确勾选的任务 ID；后续新增任务不自动继承&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;separated-audit-impact-row&quot;&gt;&lt;span&gt;版本校验&lt;/span&gt;&lt;span&gt;确认时再次校验；冲突则整次阻止，不覆盖任务页修改&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`;
          summary = `待生效：${targets.length} 个任务`;
        } else {
          const targets = separatedAuditCurrentTargets().filter((target) =&gt; pending.affectedIds.includes(target.id));
          const taskIds = new Set(targets.map((target) =&gt; target.taskId));
          const onlineTaskIds = new Set(targets.filter((target) =&gt; target.status === &#x27;已上线&#x27;).map((target) =&gt; target.taskId));
          const changeText = pending.mode === &#x27;add&#x27; ? `新增 ${pending.added} 条关联` : `解除 ${pending.removed} 条关联`;
          const immutableText = separatedAuditState.tab === &#x27;machine&#x27; ? &#x27;任务内全局条件、包含/不包含、失败策略均不修改&#x27; : &#x27;只修改答题组件实例与标签的关联&#x27;;
          html = `&lt;h3 class=&quot;separated-audit-confirm-title&quot;&gt;确认关联变更生效&lt;/h3&gt;&lt;div class=&quot;separated-audit-impact-list&quot;&gt;&lt;div class=&quot;separated-audit-impact-row&quot;&gt;&lt;span&gt;变更内容&lt;/span&gt;&lt;strong&gt;${changeText}&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;separated-audit-impact-row&quot;&gt;&lt;span&gt;关联范围&lt;/span&gt;&lt;span&gt;${pending.labelIds.length} 个标签 · ${pending.targetIds.length} 个应用对象&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;separated-audit-impact-row&quot;&gt;&lt;span&gt;保持不变&lt;/span&gt;&lt;span&gt;${immutableText}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;separated-audit-impact-row&quot;&gt;&lt;span&gt;影响任务&lt;/span&gt;&lt;span&gt;${taskIds.size} 个任务（已上线 ${onlineTaskIds.size}，未上线 ${taskIds.size - onlineTaskIds.size}）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;separated-audit-impact-row&quot;&gt;&lt;span&gt;版本校验&lt;/span&gt;&lt;span&gt;确认时再次校验；冲突则整次阻止，不覆盖任务页修改&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`;
          summary = `待生效：新增 ${pending.added} 条 · 解除 ${pending.removed} 条`;
        }
        separatedAuditFind(&#x27;#separated-audit-confirm-view&#x27;).innerHTML = `${html}&lt;div class=&quot;separated-audit-impact-warning&quot;&gt;确认后，已上线任务立即影响尚未生成快照的新 Case；已有快照与已处理 Case 不变。未上线任务保持未上线。&lt;/div&gt;`;
        separatedAuditFind(&#x27;#separated-audit-editor-view&#x27;).hidden = true;
        separatedAuditFind(&#x27;#separated-audit-confirm-view&#x27;).hidden = false;
        separatedAuditFind(&#x27;#separated-audit-modal-title&#x27;).textContent = &#x27;确认生效&#x27;;
        separatedAuditFind(&#x27;#separated-audit-modal-summary&#x27;).textContent = summary;
        separatedAuditFind(&#x27;#separated-audit-cancel&#x27;).textContent = &#x27;返回修改&#x27;;
        separatedAuditFind(&#x27;#separated-audit-save&#x27;).textContent = &#x27;确认生效&#x27;;
        separatedAuditState.modalStep = &#x27;confirm&#x27;;
      }

      function separatedAuditCommitPending() {
        const pending = separatedAuditState.pending;
        if (pending.kind === &#x27;configure-machine-item&#x27;) {
          const item = separatedAuditMachineItemById(pending.itemId);
          const currentConditionIds = separatedAuditParentIds(item);
          const conditionIds = pending.mappings.map((mapping) =&gt; mapping.conditionId);
          const allConditionIds = new Set([...currentConditionIds,...conditionIds]);
          allConditionIds.forEach((conditionId) =&gt; {
            const mapping = pending.mappings.find((candidate) =&gt; candidate.conditionId === conditionId);
            const desiredTargets = new Set(mapping ? mapping.targetIds : []);
            const key = `${conditionId}::${item.id}`;
            const relations = separatedAuditRelations.machine[key] || (separatedAuditRelations.machine[key] = new Set());
            separatedAuditMachineConditionTasks(conditionId).forEach((target) =&gt; {
              const taskCondition = separatedAuditMachineConditionOnTask(target,conditionId);
              if (desiredTargets.has(target.id)) {
                relations.add(target.id);
                if (taskCondition &amp;&amp; !taskCondition.tagIds.includes(item.id)) taskCondition.tagIds.push(item.id);
              } else {
                relations.delete(target.id);
                if (taskCondition) taskCondition.tagIds = taskCondition.tagIds.filter((id) =&gt; id !== item.id);
              }
            });
          });
          item.parentIds = [...conditionIds];
          if (pending.isIncoming) {
            const firstCondition = separatedAuditLabels.machine.find((condition) =&gt; condition.id === conditionIds[0]);
            if (firstCondition &amp;&amp; !firstCondition.children.some((candidate) =&gt; candidate.id === item.id)) firstCondition.children.push(item);
            separatedAuditIncomingMachineItems = separatedAuditIncomingMachineItems.filter((candidate) =&gt; candidate.id !== item.id);
          }
          separatedAuditState.machineView = &#x27;connected&#x27;;
          separatedAuditState.selected = item.id;
          separatedAuditState.parentFilter = conditionIds[0];
        } else if (pending.kind === &#x27;display&#x27;) {
          let configId = `dc${separatedAuditState.nextConfigId++}`;
          if (separatedAuditState.displayEditingId) {
            const index = separatedAuditDisplayConfigs.findIndex((config) =&gt; config.id === separatedAuditState.displayEditingId);
            if (index &gt;= 0) {
              configId = separatedAuditDisplayConfigs[index].id;
              separatedAuditDisplayConfigs.splice(index,1);
            }
          }
          if (pending.records[0].targetIds.length) separatedAuditDisplayConfigs.push({id:configId,componentId:separatedAuditState.selected,targetIds:[...pending.records[0].targetIds]});
        } else {
          pending.labelIds.forEach((labelId) =&gt; {
            const relations = separatedAuditRelationSet(labelId);
            const label = separatedAuditLabel(labelId);
            pending.targetIds.forEach((targetId) =&gt; {
              if (pending.mode === &#x27;add&#x27;) relations.add(targetId);
              else relations.delete(targetId);
              if (separatedAuditState.tab === &#x27;machine&#x27; &amp;&amp; label.level &gt; 1) {
                const target = separatedAuditCurrentTargets().find((item) =&gt; item.id === targetId);
                const condition = target ? separatedAuditMachineConditionFor(target, label) : null;
                if (condition) {
                  if (pending.mode === &#x27;add&#x27; &amp;&amp; !condition.tagIds.includes(labelId)) condition.tagIds.push(labelId);
                  if (pending.mode === &#x27;remove&#x27;) condition.tagIds = condition.tagIds.filter((id) =&gt; id !== labelId);
                }
              }
            });
          });
        }
        const message = pending.kind === &#x27;configure-machine-item&#x27; ? (pending.isIncoming ? &#x27;新标签已关联全局条件并应用到所选任务&#x27; : &#x27;机审标签应用已调整&#x27;) : (pending.kind === &#x27;display&#x27; ? &#x27;展示组件配置已确认生效&#x27; : &#x27;关联变更已确认生效&#x27;);
        separatedAuditCloseModal();
        separatedAuditRender();
        separatedAuditShowToast(`${message}；已上线任务仅影响尚未生成快照的新 Case`);
      }

      function separatedAuditHandlePrimary() {
        if (separatedAuditState.modalStep === &#x27;confirm&#x27;) separatedAuditCommitPending();
        else separatedAuditPrepareConfirmation();
      }

      function separatedAuditHandleCancel() {
        if (separatedAuditState.modalStep === &#x27;confirm&#x27;) {
          separatedAuditState.modalStep = &#x27;edit&#x27;;
          separatedAuditFind(&#x27;#separated-audit-editor-view&#x27;).hidden = false;
          separatedAuditFind(&#x27;#separated-audit-confirm-view&#x27;).hidden = true;
          separatedAuditFind(&#x27;#separated-audit-modal-title&#x27;).textContent = separatedAuditState.modalEditorTitle;
          separatedAuditFind(&#x27;#separated-audit-cancel&#x27;).textContent = &#x27;取消&#x27;;
          separatedAuditFind(&#x27;#separated-audit-save&#x27;).textContent = &#x27;下一步：确认生效&#x27;;
          separatedAuditUpdateModalSummary();
        } else separatedAuditCloseModal();
      }

      function separatedAuditCloseModal() {
        separatedAuditFind(&#x27;#separated-audit-overlay&#x27;).classList.remove(&#x27;is-open&#x27;);
        separatedAuditFind(&#x27;#separated-audit-overlay&#x27;).setAttribute(&#x27;aria-hidden&#x27;,&#x27;true&#x27;);
        separatedAuditState.modalStep = &#x27;closed&#x27;;
        separatedAuditState.pending = null;
        separatedAuditState.attachMachineDraft = null;
      }

      function separatedAuditShowToast(message) {
        const toast = separatedAuditFind(&#x27;#separated-audit-toast&#x27;);
        toast.textContent = message;
        toast.classList.add(&#x27;is-showing&#x27;);
        window.setTimeout(() =&gt; toast.classList.remove(&#x27;is-showing&#x27;), 2800);
      }

      function separatedAuditRender() {
        const isMachine = separatedAuditState.tab === &#x27;machine&#x27;;
        const isMachinePending = isMachine &amp;&amp; separatedAuditState.machineView === &#x27;pending&#x27;;
        separatedAuditFind(&#x27;#separated-audit-config-zone&#x27;).hidden = isMachinePending;
        separatedAuditRenderSelector();
        if (!isMachinePending) {
          separatedAuditRenderCurrent();
          separatedAuditRenderTable();
        }
        const notes = {
          machine:[&#x27;只展示可应用标签；数值、枚举与阈值在任务侧条件中只读呈现&#x27;,&#x27;任务内全局条件、包含/不包含、阈值和失败策略只读，本页仅调整标签关系&#x27;],
          manual:[&#x27;按层级平铺检索；多父级标签按 labelId 去重展示&#x27;,&#x27;关联对象为人审任务里的具体答题组件实例&#x27;],
          display:[&#x27;选择展示组件；展示位置由系统固定，不需要运营配置&#x27;,&#x27;固定展示位置：审核页第二列最下方&#x27;]
        };
        separatedAuditFind(&#x27;#separated-audit-selector-note&#x27;).textContent = notes[separatedAuditState.tab][0];
        separatedAuditFind(&#x27;#separated-audit-toolbar-note&#x27;).textContent = notes[separatedAuditState.tab][1];
        separatedAuditFind(&#x27;#separated-audit-selector-title&#x27;).textContent = isMachine ? &#x27;机审标签列表&#x27; : (separatedAuditState.tab === &#x27;display&#x27; ? &#x27;展示组件列表&#x27; : &#x27;标签列表&#x27;);
        separatedAuditFind(&#x27;#separated-audit-primary-index&#x27;).hidden = false;
        separatedAuditFind(&#x27;#separated-audit-primary-title&#x27;).textContent = isMachine ? &#x27;机审标签&#x27; : (separatedAuditState.tab === &#x27;display&#x27; ? &#x27;展示组件&#x27; : &#x27;人审标签&#x27;);
        separatedAuditFind(&#x27;#separated-audit-primary-note&#x27;).textContent = isMachine ? &#x27;先选标签，再查看其对应全局条件与实际应用任务&#x27; : (separatedAuditState.tab === &#x27;display&#x27; ? &#x27;选择展示组件并维护其应用任务&#x27; : &#x27;选择一、二、三级标签；同一标签只展示一次&#x27;);
        const configTitles = {
          machine:[&#x27;机审任务应用明细&#x27;,&#x27;一行对应一个任务内全局条件实例；任务条件表达式只读&#x27;],
          manual:[&#x27;答题组件应用明细&#x27;,&#x27;关系落到具体答题组件实例，同一任务下的多个组件分别展示&#x27;],
          display:[&#x27;已应用任务&#x27;,&#x27;一行展示一个真实任务；位置固定，仅维护任务范围&#x27;]
        };
        separatedAuditFind(&#x27;#separated-audit-config-title&#x27;).textContent = configTitles[separatedAuditState.tab][0];
        separatedAuditFind(&#x27;#separated-audit-config-note&#x27;).textContent = configTitles[separatedAuditState.tab][1];
        if (!isMachinePending) {
          const currentNode = separatedAuditState.tab === &#x27;display&#x27; ? null : separatedAuditLabel(separatedAuditState.selected);
          separatedAuditFind(&#x27;#separated-audit-current-caption&#x27;).textContent = separatedAuditState.tab === &#x27;display&#x27; ? &#x27;当前展示组件&#x27; : (isMachine ? &#x27;当前机审标签&#x27; : (currentNode.level === 1 ? &#x27;当前一级标签&#x27; : &#x27;当前标签&#x27;));
        }
